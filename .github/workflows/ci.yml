name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned tools and dependencies
        run: make install PLAYWRIGHT_INSTALL='npx playwright install --with-deps chromium'

      - name: Bootstrap Compose environment
        run: make env-file

      - name: Run all lint and test groups
        run: make test COMPOSE='docker compose'

      - name: Build production SPA
        run: make web-build

      - name: Build production Docker image
        run: make docker-build COMPOSE='docker compose'
