version: '3.8'
services:
  auth-service:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      DB_DSN: "host=db user=gorm password=gorm dbname=gorm port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "your-super-secret-jwt-key-here"
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: gorm
      POSTGRES_DB: gorm
    ports:
      - "5432:5432"


  redis:
    image: redis:7
    ports:
      - "6379:6379"
