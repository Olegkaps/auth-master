# Container tests with Podman Compose. Go caches use test-go-mod and test-go-build.
# test-integration starts PostgreSQL and sets INTEGRATION_DATABASE_URL, so it
# does not need an OCI socket for the database.
# The Testcontainers service needs the host Podman API mounted at
# /var/run/docker.sock; set PODMAN_SOCKET to its path.
#
# Before using rootless Podman on Linux:
#
#   podman compose -f docker-compose.test.yml run --rm test
#   podman compose -f docker-compose.test.yml run --rm test-integration
#   podman compose -f docker-compose.test.yml run --rm test-coverage
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

  test:
    image: golang:1.25-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - test-go-mod:/go/pkg/mod
      - test-go-build:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      # Podman's socket is exposed as a Docker-compatible API for Testcontainers.
      DOCKER_HOST: unix:///var/run/docker.sock
    command: sh -eu -c "go mod download && go test ./... -count=1"

  test-integration:
    image: golang:1.25-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - test-go-mod:/go/pkg/mod
      - test-go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      INTEGRATION_DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      REQUIRE_COVERAGE_GATE: "1"
    command: sh -eu -c "go mod download && go test ./... -count=1 && go test -tags=covgate ./internal/covgate -count=1"

  test-coverage:
    image: golang:1.25-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - test-go-mod:/go/pkg/mod
      - test-go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      INTEGRATION_DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
    command: sh -eu -c "go mod download && go test ./... -count=1 -coverprofile=coverage.out && go tool cover -func=coverage.out | tail -30"

volumes:
  test-go-mod:
  test-go-build:
