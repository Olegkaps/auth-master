basePath: /
definitions:
  httptransport.AdminUserRow:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      kind:
        type: string
      login:
        type: string
      superuser:
        type: boolean
    type: object
  httptransport.AdminUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/httptransport.AdminUserRow'
        type: array
    type: object
  httptransport.AssignRoleRequestBody:
    properties:
      level:
        type: string
      user_id:
        type: string
      valid_until:
        type: string
    type: object
  httptransport.ChangePasswordRequestBody:
    properties:
      code:
        description: Code is the OTP emailed by POST /v1/auth/password/2fa.
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  httptransport.CreateRegistrationInviteRequest:
    properties:
      email:
        type: string
      superuser:
        description: Superuser grants superuser access to the account registered with
          this invite.
        type: boolean
      ttl_seconds:
        type: integer
    type: object
  httptransport.CreateRegistrationInviteResponse:
    properties:
      expires_at:
        type: string
      registration_url:
        type: string
      token:
        type: string
    type: object
  httptransport.CreateRoleRequestBody:
    properties:
      description:
        type: string
      name:
        type: string
      parent_id:
        type: string
      parent_ids:
        items:
          type: string
        type: array
    type: object
  httptransport.CreateRoleResponse:
    properties:
      role_id:
        type: string
    type: object
  httptransport.DecideRoleRequestBody:
    properties:
      approve:
        type: boolean
    type: object
  httptransport.ErrEnvelope:
    properties:
      error:
        type: string
    type: object
  httptransport.HasRoleResponse:
    properties:
      has_role:
        type: boolean
    type: object
  httptransport.LoginOTPResponse:
    properties:
      login_challenge:
        description: |-
          LoginChallenge must be sent back to verify-otp; it binds the OTP to this
          password-verified attempt (second factor).
        type: string
      otp_sent:
        type: boolean
    type: object
  httptransport.LoginPasswordExpiredResponse:
    properties:
      password_expired:
        type: boolean
    type: object
  httptransport.LoginRequestBody:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  httptransport.LoginVerifyRequestBody:
    properties:
      challenge:
        type: string
      code:
        type: string
      device_id:
        type: string
      device_label:
        type: string
    type: object
  httptransport.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  httptransport.MagicLinkStartRequest:
    properties:
      login:
        type: string
    type: object
  httptransport.MagicLinkStartResponse:
    properties:
      status:
        example: link_sent
        type: string
    type: object
  httptransport.MagicLinkVerifyRequest:
    properties:
      device_id:
        type: string
      device_label:
        type: string
      token:
        type: string
    type: object
  httptransport.MeResponse:
    properties:
      email: {}
      id:
        type: string
      kind:
        type: string
      login:
        type: string
      superuser:
        type: boolean
    type: object
  httptransport.MountRoleRequest:
    properties:
      parent_id:
        type: string
    type: object
  httptransport.PasswordResetCompleteRequest:
    properties:
      code:
        type: string
      login:
        type: string
      new_password:
        type: string
    type: object
  httptransport.PasswordResetStartRequest:
    properties:
      login:
        type: string
    type: object
  httptransport.PasswordResetStartResponse:
    properties:
      status:
        example: otp_sent
        type: string
    type: object
  httptransport.PatchRoleRequestBody:
    properties:
      description:
        type: string
    type: object
  httptransport.RefreshRequestBody:
    properties:
      device_id:
        type: string
      device_label:
        type: string
      refresh_token:
        description: |-
          RefreshToken lets a multi-account client refresh a specific account without
          the cookie (non-ambient, so no CSRF header is required for this path).
        type: string
    type: object
  httptransport.RegisterCreatedResponse:
    properties:
      user_id:
        type: string
    type: object
  httptransport.RegisterRequestBody:
    properties:
      email:
        type: string
      invite_token:
        type: string
      login:
        type: string
      password:
        type: string
    type: object
  httptransport.RegistrationInvitePreviewResponse:
    properties:
      email:
        type: string
      expires_at:
        type: string
      superuser:
        type: boolean
      valid:
        type: boolean
    type: object
  httptransport.RoleDTO:
    properties:
      CreatedAt:
        type: string
      Description:
        type: string
      ID:
        type: string
      Name:
        type: string
      ParentIDs:
        items:
          type: string
        type: array
    type: object
  httptransport.RoleMemberRow:
    properties:
      email: {}
      level:
        type: string
      login:
        type: string
      user_id:
        type: string
    type: object
  httptransport.RoleMembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/httptransport.RoleMemberRow'
        type: array
    type: object
  httptransport.RoleRequestCreateBody:
    properties:
      target_user_id:
        type: string
    type: object
  httptransport.RoleRequestCreateResponse:
    properties:
      request_id:
        type: string
      status:
        example: pending
        type: string
    type: object
  httptransport.RoleRequestRow:
    properties:
      DecidedBy:
        type: string
      ID:
        type: string
      RequesterID:
        type: string
      RoleID:
        type: string
      Status:
        type: string
      TargetUserID:
        type: string
    type: object
  httptransport.RoleRequestsListResponse:
    properties:
      requests:
        items:
          $ref: '#/definitions/httptransport.RoleRequestRow'
        type: array
    type: object
  httptransport.RolesListResponse:
    properties:
      roles:
        items:
          $ref: '#/definitions/httptransport.RoleDTO'
        type: array
    type: object
  httptransport.ServiceTokenRequestBody:
    properties:
      login:
        type: string
      secret:
        type: string
    type: object
  httptransport.SessionRevokeOTPResponse:
    properties:
      status:
        type: string
    type: object
  httptransport.SessionRevokeRequestBody:
    properties:
      code:
        type: string
    type: object
  httptransport.SessionRow:
    properties:
      created_at:
        type: string
      device_id:
        type: string
      device_label:
        type: string
      expires_at:
        type: string
      id:
        type: string
      revoked:
        type: boolean
    type: object
  httptransport.SessionsListResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/httptransport.SessionRow'
        type: array
    type: object
  httptransport.SetRoleParentRequest:
    properties:
      parent_id:
        type: string
    type: object
  httptransport.StatusResponse:
    properties:
      status:
        example: otp_sent
        type: string
    type: object
  httptransport.StepUp2FACompleteRequest:
    properties:
      code:
        type: string
      correlation_id:
        type: string
    type: object
  httptransport.StepUp2FAExpireRequestBody:
    properties:
      correlation_id:
        type: string
    type: object
  httptransport.StepUp2FAOKResponse:
    properties:
      status:
        type: string
    type: object
  httptransport.StepUp2FAStartRequestBody:
    properties:
      ttl_seconds:
        type: integer
    type: object
  httptransport.StepUp2FAStartResponse:
    properties:
      correlation_id:
        type: string
    type: object
  httptransport.StepUp2FAStatusResponse:
    properties:
      status:
        type: string
    type: object
  httptransport.TokenIntrospectionResponse:
    properties:
      kid:
        type: string
      login:
        type: string
      subject:
        type: string
      typ:
        type: string
    type: object
  httptransport.TokenPairResponse:
    properties:
      access_token:
        type: string
      csrf_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  httptransport.UserRoleDTO:
    properties:
      GrantedBy:
        type: string
      ID:
        type: string
      Level:
        type: string
      RoleID:
        type: string
      UserID:
        type: string
      ValidFrom:
        type: string
      ValidUntil:
        type: string
    type: object
  httptransport.UserRolesListResponse:
    properties:
      user_roles:
        items:
          $ref: '#/definitions/httptransport.UserRoleDTO'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: Authentication and authorization REST API (JWT access + refresh, OTP,
    RBAC, registration invites).
  title: Auth service API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 204 when the process accepts HTTP.
      responses:
        "204":
          description: No content
      summary: Liveness probe
      tags:
      - system
  /metrics:
    get:
      description: OpenMetrics/Prometheus text exposition format.
      produces:
      - text/plain
      responses:
        "200":
          description: Metrics body
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - system
  /v1/admin/registration-invites:
    post:
      consumes:
      - application/json
      parameters:
      - description: Must match csrf_token cookie (set after login)
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Optional locked email and TTL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateRegistrationInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httptransport.CreateRegistrationInviteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "403":
          description: Not a superuser
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      security:
      - BearerAuth: []
      summary: Create registration invite
      tags:
      - admin
  /v1/admin/signing-keys/rotate:
    post:
      parameters:
      - description: Must match csrf_token cookie
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      security:
      - BearerAuth: []
      summary: Rotate signing key
      tags:
      - admin
  /v1/admin/users:
    get:
      parameters:
      - description: Max users (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.AdminUsersResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.LoginRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: otp_sent indicates whether OTP email was sent
          schema:
            $ref: '#/definitions/httptransport.LoginOTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "403":
          description: Password must be changed
          schema:
            $ref: '#/definitions/httptransport.LoginPasswordExpiredResponse'
        "423":
          description: Account locked
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Login (password step)
      tags:
      - auth
  /v1/auth/login/magic-link:
    post:
      consumes:
      - application/json
      description: Public passwordless flow. Always returns 200 to avoid enumeration;
        a link is emailed only when the login exists and has an email.
      parameters:
      - description: Login to send a link to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.MagicLinkStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.MagicLinkStartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Request a magic login link
      tags:
      - auth
  /v1/auth/login/magic-link/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: One-time token and device binding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.MagicLinkVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Includes csrf_token
          schema:
            $ref: '#/definitions/httptransport.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid or expired link
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Complete magic-link login
      tags:
      - auth
  /v1/auth/login/verify-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: OTP and device binding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.LoginVerifyRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: Includes csrf_token for subsequent CSRF-protected calls
          schema:
            $ref: '#/definitions/httptransport.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid OTP
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Verify login OTP
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: Revokes the session named by refresh_token in the body (multi-account,
        non-ambient) or, if absent, the HttpOnly cookie session (requires X-CSRF-Token).
      parameters:
      - description: Required only for the cookie path
        in: header
        name: X-CSRF-Token
        type: string
      - description: Optional refresh_token to revoke a specific account
        in: body
        name: body
        schema:
          $ref: '#/definitions/httptransport.LogoutRequest'
      responses:
        "204":
          description: No content
        "403":
          description: CSRF validation failed
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Logout
      tags:
      - auth
  /v1/auth/password:
    post:
      consumes:
      - application/json
      description: Requires the old password AND the email OTP from POST /v1/auth/password/2fa.
      parameters:
      - description: Old/new password and 2FA code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.ChangePasswordRequestBody'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Password policy or validation
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid old password or 2FA code
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /v1/auth/password/2fa:
    post:
      description: Emails a one-time code that must be supplied to POST /v1/auth/password.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.StatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      security:
      - BearerAuth: []
      summary: Start password change 2FA
      tags:
      - auth
  /v1/auth/password/reset/complete:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login, OTP code and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.PasswordResetCompleteRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Password policy or validation
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Complete password reset (OTP)
      tags:
      - auth
  /v1/auth/password/reset/start:
    post:
      consumes:
      - application/json
      description: Public forgot/expired-password flow. Always returns 200 to avoid
        account enumeration; an email is sent only when the login exists and has an
        email.
      parameters:
      - description: Login to reset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.PasswordResetStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.PasswordResetStartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Start password reset (OTP)
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Requires HttpOnly refresh cookie (name from REFRESH_COOKIE_NAME,
        default refresh_token) and X-CSRF-Token matching the csrf_token cookie.
      parameters:
      - description: Must match csrf_token cookie
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Optional device metadata
        in: body
        name: body
        schema:
          $ref: '#/definitions/httptransport.RefreshRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.TokenPairResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "403":
          description: CSRF validation failed
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Refresh access token
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates an account; invite must be valid and may lock the registration
        email.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.RegisterRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httptransport.RegisterCreatedResponse'
        "400":
          description: Invalid JSON, password policy, duplicate login/email, …
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "410":
          description: Invalid or expired invite
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Register human user
      tags:
      - auth
  /v1/auth/registration-invite:
    get:
      parameters:
      - description: Raw invite token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.RegistrationInvitePreviewResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Preview registration invite
      tags:
      - auth
  /v1/auth/service-token:
    post:
      consumes:
      - application/json
      parameters:
      - description: Service login and secret
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.ServiceTokenRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: access_token only (no csrf_token)
          schema:
            $ref: '#/definitions/httptransport.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Issue service access token
      tags:
      - auth
  /v1/auth/step-up-2fa/complete:
    post:
      consumes:
      - application/json
      parameters:
      - description: Correlation id and OTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.StepUp2FACompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.StepUp2FAOKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "401":
          description: Invalid OTP
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
      summary: Complete step-up 2FA OTP
      tags:
      - auth
  /v1/auth/step-up-2fa/expire:
    post:
      consumes:
      - application/json
      parameters:
      - description: Must match csrf_token cookie
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Correlation id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httptransport.StepUp2FAExpireRequestBody'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "403":
          description: CSRF validation failed
          schema:
            $ref: '#/definitions/httptransport.ErrEnvelope'
        "404":
          description: Not Found
          schema:
