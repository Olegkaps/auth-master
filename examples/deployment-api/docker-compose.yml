name: auth-master-deployment-api
services:
  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment: {POSTGRES_USER: auth, POSTGRES_PASSWORD: auth, POSTGRES_DB: auth}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U auth -d auth"], interval: 2s, timeout: 2s, retries: 30}
  mailpit:
    image: axllent/mailpit:v1.27.2@sha256:22b066bd9b78a2c343eee873da84f7c44ef0a4b989a4ea504e329185092c0e71
    ports: ["127.0.0.1:${DEPLOYMENT_MAILPIT_PORT:-8392}:8025"]
    healthcheck: {test: [CMD-SHELL, "wget -q -O /dev/null 'http://localhost:8025/api/v1/messages?limit=1'"], interval: 2s, timeout: 2s, retries: 30}
  authd:
    build: {context: ../.., dockerfile: examples/Authd.Dockerfile}
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      SMTP_HOST: mailpit
      BOOTSTRAP_SUPERUSER_LOGIN: admin
      BOOTSTRAP_SUPERUSER_EMAIL: admin@example.test
      BOOTSTRAP_SUPERUSER_PASSWORD: Adm1n!Passw0rd123
      BOOTSTRAP_SUPERUSER_SERVICE_LOGIN: example-seeder
      BOOTSTRAP_SUPERUSER_SERVICE_SECRET: Example-Seeder!Secret9
    depends_on: {postgres: {condition: service_healthy}, mailpit: {condition: service_healthy}}
    ports: ["127.0.0.1:${DEPLOYMENT_AUTH_PORT:-8292}:8080"]
    healthcheck: {test: [CMD, /healthcheck, http://localhost:8080/healthz], interval: 2s, timeout: 3s, retries: 30}
  app:
    build: {context: ../.., dockerfile: examples/Dockerfile, args: {EXAMPLE: deployment-api}}
    environment: {AUTH_HTTP_URL: "http://authd:8080", HTTP_ADDR: ":8092"}
    ports: ["127.0.0.1:${DEPLOYMENT_API_PORT:-8192}:8092"]
    depends_on: {authd: {condition: service_healthy}}
    healthcheck: {test: [CMD, /healthcheck, http://localhost:8092/healthz], interval: 2s, timeout: 3s, retries: 30}
  seed:
    profiles: [seed]
    build: {context: ../.., dockerfile: examples/Dockerfile, target: demo-tools, args: {EXAMPLE: deployment-api}}
    command: [seed]
    environment:
      EXAMPLE: deployment-api
      AUTH_HTTP_URL: http://authd:8080
      AUTH_GRPC_ADDR: authd:9090
      MAILPIT_URL: http://mailpit:8025
      APP_URL: http://app:8092
      AUTH_SERVICE_LOGIN: example-seeder
      AUTH_SERVICE_SECRET: Example-Seeder!Secret9
    depends_on: {authd: {condition: service_healthy}, mailpit: {condition: service_healthy}, app: {condition: service_healthy}}
