services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Use container env (set from POSTGRES_*) so it stays correct if .env changes credentials.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    env_file: .env
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  authd:
    build: .
    env_file: .env
    environment:
      # Inside the stack, DB and SMTP are sibling services (override host-oriented .env).
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      SMTP_HOST: mailpit
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      REGISTRATION_INVITE_BASE_URL: ${REGISTRATION_INVITE_BASE_URL:-http://localhost:8080}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build: ./web
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - authd

volumes:
  postgres-data:
